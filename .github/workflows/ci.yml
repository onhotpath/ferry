# CI is the deliverable, not a formality (#64).
#
# Every invariant ADR-0002 states gets a job or a step that fails when the
# invariant is broken, because the whole point of the rules is that they hold
# when nobody is looking. Each assertion prints what it checked and what it
# found, so a red run is diagnosable from the log alone.
name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'driver/*/v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ADR-0001 sets the floor at go 1.27, which is not GA yet: go1.27rc2 is what
  # exists. setup-go spells that release candidate '1.27.0-rc.2'.
  #
  # TODO: move this to '1.27.x' once Go 1.27 is released. Four workarounds
  # expire on the same day: this pin, the toolchain guard in the GOWORK=off
  # step, the source build of golangci-lint (now in the Makefile), and
  # staticcheck being switched off in .golangci.yml because the version
  # golangci-lint bundles cannot parse Go 1.27 source.
  GO_VERSION: '1.27.0-rc.2'

  # The golangci-lint pin used to live here. It lives in the Makefile now, as
  # GOLANGCI_LINT_VERSION, because the lint job runs `make lint` and there is no
  # value in two files naming the same version. It is still a pin rather than
  # 'latest', so a lint failure is always this repository's doing and never a
  # linter release nobody asked for.

  # The coverage threshold used to be an env var here. It lives in codecov.yml
  # now, on the line marked `ferry-core-threshold`, and the coverage job reads it
  # from there. Codecov needs the number in its own file regardless, and two
  # copies of one threshold is a pair that drifts.

jobs:
  # ADR-0002: "the directory is a CI predicate". driver/* is exactly the set of
  # modules that must pass the conformance suite, expressed as a glob and never
  # as a hand-maintained list, so a driver added later is picked up whether or
  # not anyone edits this workflow. Every other job takes its module list from
  # here, so there is one place where discovery happens.
  #
  # examples/ is a module too, and it is discovered here for the same reason:
  # a published example that no longer compiles is worse than no example, so it
  # is held to the same build, vet, test and lint as everything else. It is not
  # a driver and passes no conformance suite; it is a consumer of core, built
  # the way a reader is being told to build.
  modules:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      list: ${{ steps.discover.outputs.list }}
    steps:
      - uses: actions/checkout@v7

      - name: Glob driver/* and examples for module directories
        id: discover
        run: |
          set -euo pipefail
          shopt -s nullglob

          drivers=()
          for f in driver/*/go.mod; do
            drivers+=("${f%/go.mod}")
          done

          dirs=(. "${drivers[@]}")
          for f in examples/go.mod; do
            dirs+=("${f%/go.mod}")
          done

          echo "modules discovered: ${#dirs[@]}"
          printf '  %s\n' "${dirs[@]}"

          # A glob that silently matches nothing is the failure mode this whole
          # scheme has, so it is the one thing asserted about the glob itself.
          # The count asserted is the driver one specifically: examples/ matching
          # must not be able to stand in for every driver having disappeared.
          if [ "${#drivers[@]}" -eq 0 ]; then
            echo "FAIL: driver/*/go.mod matched nothing."
            echo "      Either every driver module lost its go.mod, or the glob"
            echo "      stopped working and this workflow was about to test core"
            echo "      alone while reporting green."
            exit 1
          fi

          matrix=$(printf '%s\n' "${dirs[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "matrix=${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "list=${dirs[*]}" >> "$GITHUB_OUTPUT"

  # The go.mod assertions. All of them read go.mod through `go mod edit -json`,
  # which is the toolchain's own parser, so they see both the block form and the
  # single-line form of every directive and have none of grep's blind spots.
  invariants:
    name: go.mod invariants
    runs-on: ubuntu-latest
    needs: modules
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: No replace directive is checked in (ADR-0002)
        run: |
          set -euo pipefail
          fail=0
          for m in ${{ needs.modules.outputs.list }}; do
            n=$(go mod edit -json "$m/go.mod" | jq '(.Replace // []) | length')
            echo "  $m/go.mod: $n replace directive(s)"
            if [ "$n" -ne 0 ]; then
              go mod edit -json "$m/go.mod" |
                jq -r '(.Replace // [])[] | "      replace \(.Old.Path) => \(.New.Path)"'
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: ADR-0002 - no replace directive is ever checked in."
            echo "      go.work gives local development; a checked-in replace"
            echo "      gives it permanently and means CI never once builds"
            echo "      against the version consumers resolve."
            exit 1
          fi
          echo "OK: no module carries a replace directive."

      - name: No go.mod pins a toolchain (ADR-0002)
        run: |
          set -euo pipefail
          fail=0
          for m in ${{ needs.modules.outputs.list }}; do
            t=$(go mod edit -json "$m/go.mod" | jq -r '.Toolchain // ""')
            echo "  $m/go.mod: toolchain ${t:-<none>}"
            [ -z "$t" ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: the toolchain pin belongs in go.work, which consumers"
            echo "      never see. In a go.mod it names a release candidate at"
            echo "      every consumer of ferry."
            exit 1
          fi
          echo "OK: the only toolchain pin is go.work's."

      - name: go.work uses every discovered module
        run: |
          set -euo pipefail
          # Without this, a driver added under driver/ but not added to go.work
          # fails the build job with "directory prefix . does not contain modules
          # listed in go.work", which names neither the module nor the fix.
          used=$(go work edit -json | jq -r '.Use[].DiskPath' | sed 's|^\./||' | sort)
          # shellcheck disable=SC2086  # one module path per word is wanted
          found=$(printf '%s\n' ${{ needs.modules.outputs.list }} | sort)
          echo "go.work use: $(echo "$used" | tr '\n' ' ')"
          echo "discovered:  $(echo "$found" | tr '\n' ' ')"
          if [ "$used" != "$found" ]; then
            echo "FAIL: go.work and the driver/* glob disagree."
            diff <(echo "$used") <(echo "$found") || true
            echo "      Add the module to go.work's use block."
            exit 1
          fi
          echo "OK: go.work covers every module the glob found."

      - name: Core's require block is empty (ADR-0002)
        run: |
          set -euo pipefail
          n=$(go mod edit -json go.mod | jq '(.Require // []) | length')
          echo "  go.mod: $n require(s)"
          if [ "$n" -ne 0 ]; then
            go mod edit -json go.mod |
              jq -r '(.Require // [])[] | "      \(.Path) \(.Version)" + (if .Indirect then " // indirect" else "" end)'
            echo "FAIL: ADR-0002 - core's go.mod carries no non-stdlib require."
            echo "      Core's buildability must not depend on anything a"
            echo "      consumer can switch off, and the empty require block is"
            echo "      itself an adoption argument. A dependency ships in a"
            echo "      driver module under driver/, not here."
            exit 1
          fi
          echo "OK: core's require block is empty."

      - name: No module's go directive is below core's (ADR-0002)
        run: |
          set -euo pipefail
          core=$(go mod edit -json go.mod | jq -r '.Go // ""')
          if [ -z "$core" ]; then
            echo "FAIL: core's go.mod declares no go directive."
            exit 1
          fi
          echo "  core: go $core"

          fail=0
          for m in ${{ needs.modules.outputs.list }}; do
            [ "$m" = "." ] && continue
            v=$(go mod edit -json "$m/go.mod" | jq -r '.Go // ""')
            if [ -z "$v" ]; then
              echo "  $m: no go directive  FAIL"
              fail=1
              continue
            fi
            # A version comparison, not a string one: sort -V puts 1.9 before
            # 1.10, which a lexicographic compare gets backwards.
            lowest=$(printf '%s\n%s\n' "$core" "$v" | sort -V | head -n1)
            if [ "$v" != "$core" ] && [ "$lowest" = "$v" ]; then
              echo "  $m: go $v  BELOW core's $core"
              fail=1
            else
              echo "  $m: go $v  ok"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: ADR-0002 - the floor is transitive through imports, so a"
            echo "      driver declaring a lower directive than core buys nobody"
            echo "      anything. The lever only points up."
            exit 1
          fi
          echo "OK: every module is at or above core's floor."

      - name: No module imports encoding/json/v2 or encoding/json/jsontext (ADR-0002)
        run: |
          set -euo pipefail
          # Direct, test and external-test imports only. `go list -deps` would
          # false-positive here, because in Go 1.27 encoding/json is itself
          # implemented over encoding/json/v2, so anything touching encoding/json
          # shows it transitively. What ADR-0002 forbids is ferry naming the
          # import itself, which is the only thing that makes GOEXPERIMENT=
          # nojsonv2 fail for a consumer.
          fail=0
          for m in ${{ needs.modules.outputs.list }}; do
            # shellcheck disable=SC2016  # a Go template, not a shell expansion
            tmpl='{{$p := .ImportPath}}{{range .Imports}}{{$p}} -> {{.}}{{"\n"}}{{end}}{{range .TestImports}}{{$p}} -> {{.}}{{"\n"}}{{end}}{{range .XTestImports}}{{$p}} -> {{.}}{{"\n"}}{{end}}'
            hits=$( (cd "$m" && go list -f "$tmpl" ./...) | grep -E ' -> encoding/json/(v2|jsontext)$' || true)
            if [ -n "$hits" ]; then
              echo "  $m: FORBIDDEN import"
              printf '      %s\n' "$hits"
              fail=1
            else
              echo "  $m: clean"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: ADR-0002 - json/v2 is stdlib with an asterisk. A package"
            echo "      importing it fails under GOEXPERIMENT=nojsonv2, and that"
            echo "      switch is the consumer's, not ferry's. This is the one"
            echo "      thing that destroys ADR-0001's go 1.27 fallback."
            exit 1
          fi
          echo "OK: no module names json/v2 or jsontext."

  # Both resolution modes, per ADR-0002's measurement: the workspace resolves
  # the sibling on disk, GOWORK=off resolves what a real consumer resolves.
  # xtools' CI has never once built against the version it publishes, and this
  # job is the reason ferry's does.
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The GOWORK=off gate reads the tag list, so it needs the tags.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Workspace mode - build, vet, test
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          echo "module: ${{ matrix.module }}   go: $(go env GOVERSION)   GOWORK: $(go env GOWORK)"
          go build ./...
          go vet ./...
          go test ./...

      - name: GOWORK=off - build, vet, test
        working-directory: ${{ matrix.module }}
        run: |
          set -uo pipefail

          # Gate 1: core has no tag, so nothing on the proxy can be resolved.
          # ADR-0002 defers this mode until core is tagged. Read from the repo
          # rather than hardcoded, so the first `git tag v0.1.0` turns it on.
          tags=$(git -C "$GITHUB_WORKSPACE" tag -l 'v*')
          if [ -z "$tags" ]; then
            echo "SKIPPED: GOWORK=off build of ${{ matrix.module }}"
            echo "  why: core carries no v* tag, so a driver's require on core"
            echo "       has no version to resolve from the proxy. ADR-0002"
            echo "       defers this mode until core is tagged."
            echo "  clears: the first time core is tagged v0.x.y."
            exit 0
          fi
          echo "core tags present: $(echo "$tags" | tr '\n' ' ')"

          # Gate 2: outside the workspace there is no toolchain line, by design,
          # so the go directive has to be satisfiable by a released toolchain.
          # While the floor is 1.27 and only go1.27rc2 exists, it is not.
          if ! probe=$(GOWORK=off go list -m 2>&1); then
            case "$probe" in
              *toolchain*|*"requires go >="*)
                echo "SKIPPED: GOWORK=off build of ${{ matrix.module }}"
                echo "  why: $probe"
                echo "       go.work carries 'toolchain go1.27rc2' and no go.mod"
                echo "       does (ADR-0002), so outside the workspace the go"
                echo "       directive resolves to a Go 1.27 that is not released."
                echo "  clears: when GO_VERSION moves to 1.27.x."
                exit 0
                ;;
            esac
            echo "FAIL: GOWORK=off module resolution failed, and not for a"
            echo "      toolchain reason. This is the failure this job exists"
            echo "      to catch."
            echo "$probe"
            exit 1
          fi

          set -e
          export GOWORK=off
          echo "module: ${{ matrix.module }}   GOWORK=off"
          go build ./...
          go vet ./...
          go test ./...

  # ADR-0002 keeps ADR-0001's go 1.27 fallback alive by construction rather than
  # by anyone remembering to check, and this job is the construction.
  nojsonv2:
    name: Core builds under GOEXPERIMENT=nojsonv2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: GOEXPERIMENT=nojsonv2 go build ./...
        run: |
          set -euo pipefail
          echo "core, with the consumer's json/v2 escape hatch pulled:"
          GOEXPERIMENT=nojsonv2 go build ./...
          GOEXPERIMENT=nojsonv2 go test ./...
          echo "OK: core builds and tests with encoding/json/v2 excluded."

  format:
    name: gofmt and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: make check
        run: |
          set -euo pipefail
          # `make check` is what a developer runs before pushing: go vet, the
          # gofmt assertion, and the import-grouping assertion. Running the
          # target rather than the commands is the point - the flags, the
          # gofmt failure output and the gci section list all live in one place
          # and CI cannot drift from a local run.
          #
          # gofmt and gci both walk files rather than modules, so one run from
          # the root covers every module including any added later. `go vet` is
          # per-module and overlaps the build job on purpose: the overlap costs
          # a few seconds and means this target is the whole pre-push check
          # rather than most of it.
          make check

  lint:
    name: Lint ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache the pinned tools
        uses: actions/cache@v6
        with:
          # `make lint` installs into .bin, never into $GOPATH/bin. The key is
          # the Makefile's hash because the Makefile is where the version pin
          # and the build recipe both live, so any change to either misses.
          path: .bin
          key: tools-${{ hashFiles('Makefile') }}-go${{ env.GO_VERSION }}

      - name: make lint
        run: |
          set -euo pipefail
          # The developer's command, with the module list narrowed to this
          # matrix leg. Everything that used to be spelled out here - the
          # pinned version, `config verify` before `run`, and the source build
          # with GOTOOLCHAIN forced because every released golangci-lint binary
          # is compiled with Go 1.26 and refuses a module targeting 1.27 - now
          # lives in the Makefile, so `make lint` locally and this job cannot
          # disagree about what "lint" means.
          #
          # TODO: revert to golangci/golangci-lint-action once a golangci-lint
          # release is built with Go 1.27, which cannot happen before 1.27 is GA.
          make lint MODULES=${{ matrix.module }}

  race:
    name: Race detector on core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go test -race ./...
        run: |
          set -euo pipefail
          # Core is where the walk, the schema cache and the memoised error
          # live, so core is where a data race would be.
          go test -race ./...

  # Coverage runs per module so Codecov can report each one under its own flag.
  # Averaging a driver into core would let a well-tested driver hide a gap in
  # core, and ADR-0002 versions and releases the two independently.
  #
  # The gate below is core's alone, and it stays in this workflow rather than
  # moving to Codecov. Codecov reports; a third-party outage must not be able to
  # make an untested branch mergeable.
  coverage:
    name: Coverage ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go test -coverprofile
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          go test -covermode=atomic -coverprofile=cover.out ./...

      # Every module outside core drives core and ferrytest as well, and none
      # of that reaches core's own upload: -coverprofile without -coverpkg
      # instruments only the packages of the module under test, so a core line
      # a driver proves reports as unproven and lands in a pull request as a
      # patch gap that no test written inside core could close.
      #
      # This pass instruments core and ferrytest and nothing else, so what it
      # measures is exactly that: the core lines this module's tests reach. It
      # goes up under a flag of its own, because the statuses in codecov.yml
      # select on flags, and a module's own number must not start averaging
      # core into itself (ADR-0002).
      #
      # The pattern is spelled out rather than written as .../..., which would
      # match the driver modules themselves and put back the averaging this
      # separation exists to prevent.
      - name: go test -coverpkg core
        if: matrix.module != '.'
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          go test -covermode=atomic \
            -coverpkg=github.com/onhotpath/ferry,github.com/onhotpath/ferry/ferrytest \
            -coverprofile=cross.out ./...

      - name: Gate core at the codecov.yml threshold
        if: matrix.module == '.'
        run: |
          set -euo pipefail

          # codecov.yml is the one place the number is written. Read it from
          # there rather than keeping a second copy, and fail loudly if the
          # marked line has moved: a threshold that silently reads as empty is
          # a gate that silently passes.
          min=$(sed -n 's/^[[:space:]]*target:[[:space:]]*\([0-9]\{1,3\}\)%[[:space:]]*#[[:space:]]*ferry-core-threshold.*/\1/p' codecov.yml)
          if [ -z "$min" ]; then
            echo "FAIL: could not read the core threshold from codecov.yml."
            echo "      The gate reads the line marked 'ferry-core-threshold'."
            echo "      Restore that marker rather than hardcoding a number here."
            exit 1
          fi
          echo "threshold from codecov.yml: ${min}%"

          # cover.out lines after the mode header are:
          #   file.go:from.col,to.col numstmt count
          # so summing field 2 gives the number of coverable statements. Core is
          # a package clause and a doc comment today, which is zero of them, and
          # a percentage over zero statements is meaningless rather than perfect.
          #
          # The gate therefore says so out loud and passes. It starts biting the
          # moment core gains its first function body, which is #65, and from
          # then on it is an ordinary threshold with no special case left.
          stmts=$(awk 'NR > 1 { n += $2 } END { print n + 0 }' cover.out)
          echo "core: $stmts coverable statement(s)"

          if [ "$stmts" -eq 0 ]; then
            echo "SKIPPED: coverage gate (threshold ${min}%)"
            echo "  why: core has no statements, so there is no ratio to gate."
            echo "  clears: the first function body that lands in core."
            exit 0
          fi

          go tool cover -func=cover.out
          total=$(go tool cover -func=cover.out | awk '/^total:/ { print $3 }' | tr -d '%')
          echo "core coverage: ${total}%   threshold: ${min}%"

          awk -v t="$total" -v m="$min" 'BEGIN { exit !(t + 0 >= m + 0) }' || {
            echo "FAIL: coverage ${total}% is below the ${min}% gate."
            echo "      Core is pure logic with no I/O to plead, so the gate is"
            echo "      near-total on purpose."
            exit 1
          }
          echo "OK: coverage gate passed."

      - name: Derive the Codecov flag for this module
        id: flag
        run: |
          set -euo pipefail
          # '.' is core; a driver's flag is its path with the separator swapped,
          # because a Codecov flag may not contain a slash. GitHub's expression
          # syntax has no string replace, so it is done here, and the names have
          # to match the `flags:` block in codecov.yml exactly.
          m='${{ matrix.module }}'
          if [ "$m" = "." ]; then
            flag=core
          else
            flag=${m//\//-}
          fi
          echo "name=$flag" >> "$GITHUB_OUTPUT"

          # A module with no test file produces a cover.out holding nothing but
          # the `mode:` header. That is the absence of tests rather than a
          # measurement of zero, and Codecov cannot tell the difference: it
          # rejects the upload as REPORT_EMPTY, which is the same state a
          # genuinely broken upload lands in and which errors the whole commit.
          # #98 is what that ambiguity costs, so the empty case is named here
          # and skipped, and "no tests yet" is a line in this log instead.
          records=$(awk 'NR > 1' "$m/cover.out" | wc -l)
          if [ "$records" -eq 0 ]; then
            echo "SKIPPED: Codecov upload for flag '$flag'"
            echo "  why: $m has no test file, so cover.out carries no record."
            echo "       An empty upload reports as an error, indistinguishable"
            echo "       from a broken one."
            echo "  clears: the first _test.go under $m."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "module '$m' uploads $records record(s) under flag '$flag'"
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

          # The cross-module profile is subject to the same REPORT_EMPTY rule,
          # and it is absent for core, which is its own coverage already.
          if [ -s "$m/cross.out" ] && [ "$(awk 'NR > 1' "$m/cross.out" | wc -l)" -gt 0 ]; then
            echo "cross=true" >> "$GITHUB_OUTPUT"
          else
            echo "cross=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Codecov
        if: steps.flag.outputs.upload == 'true'
        uses: codecov/codecov-action@v7
        with:
          flags: ${{ steps.flag.outputs.name }}
          files: ${{ matrix.module }}/cover.out
          token: ${{ secrets.CODECOV_TOKEN }}
          # A pull request from a fork cannot read the token, and a contributor
          # cannot fix that. The gate above is what enforces the threshold, so
          # a failed upload reports nothing and blocks nothing.
          fail_ci_if_error: false

      # One flag for every module's cross-module profile, because what they
      # measure is one thing: core, as reached from outside it. Codecov unions
      # uploads sharing a flag, so they arrive as one report and no merge step
      # is needed to combine them.
      - name: Upload the cross-module profile to Codecov
        if: steps.flag.outputs.cross == 'true'
        uses: codecov/codecov-action@v7
        with:
          flags: crossmodule
          files: ${{ matrix.module }}/cross.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The one job that is not ubuntu-latest, and the one module that needs it.
  #
  # driver/windows puts the real registry behind //go:build windows over a small
  # seam, and an in-memory store fills that seam in a _test.go so the conformance
  # suite runs on every platform - which is what lets the module join the ubuntu
  # matrix above like every other one. What ubuntu cannot run is the tagged half:
  # the syscalls, the value types as Windows actually records them, and the change
  # notification a watch is built on.
  #
  # Be precise about what this job does and does not prove. Running the whole
  # suite here proves almost nothing extra: every one of those tests injects the
  # in-memory store through winreg.Store, so on windows-latest they execute the
  # same statements they execute on ubuntu. What earns the job is the tagged test
  # file beside them, machine_windows_test.go, which builds the driver with no
  # store at all against a scratch key under HKEY_CURRENT_USER and removes it
  # again: the two namespaces, the type tags, the redirector and
  # RegNotifyChangeKeyValue, asserted against Windows rather than against the
  # model of it. It skips rather than fails where that hive cannot be written.
  #
  # The suite still runs, because a compile failure or a vet finding under
  # GOOS=windows is worth catching and costs one job. It is named rather than
  # globbed, deliberately: the glob above is over modules that must pass the
  # suite, and this is over the one module whose plane is an operating system. A
  # second such module adds a line here.
  windows:
    name: Windows registry
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build, vet and test driver/windows on Windows
        working-directory: driver/windows
        run: |
          go build ./...
          go vet ./...
          go test ./...
          go test -race ./...

  # The one check `main`'s ruleset needs to require (#108).
  #
  # `build`, `lint` and `coverage` are matrix jobs fanned out over whatever the
  # `modules` job globbed, so their check contexts carry a module path in the
  # name and the set of them changes when the module set does. Naming those
  # contexts in a ruleset is a hand-maintained copy of the glob, and it degrades
  # in both directions: a driver added later is unguarded because its three
  # contexts are not in the list, and a driver removed or renamed leaves a
  # required context that never reports again, which blocks every pull request
  # against `main` permanently.
  #
  # `needs` on a matrix job waits for every leg of the matrix, so this job
  # follows the module set with no list to keep in step. A driver added under
  # driver/ is covered the moment the glob finds it.
  #
  # `if: always()` is what makes it a gate rather than a casualty. Without it,
  # this job is skipped whenever anything it needs fails, and a skipped check is
  # not a passing one, so the ruleset would block - the right outcome reached by
  # a reason nobody can debug from the log.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [modules, invariants, build, nojsonv2, format, lint, race, coverage, windows]
    steps:
      - uses: actions/checkout@v7

      # The list above is the one thing here that is still written by hand, and
      # it is the same shape of defect as the ruleset it replaces - just one
      # level up, per job rather than per matrix leg, so a new driver never
      # touches it and a new job does. That edit is asserted rather than
      # remembered.
      - name: The gate needs every job in this workflow
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # A job key is the only thing indented by exactly two spaces after the
          # top-level `jobs:` line; a job's own body starts at four. Reading the
          # file this way rather than through a YAML library keeps the assertion
          # on the tools every other step here already uses.
          declared=$(awk '
            /^jobs:$/ { injobs = 1; next }
            /^[^[:space:]]/ { injobs = 0 }
            injobs && /^  [A-Za-z0-9_-]+:$/ { gsub(/[ :]/, "", $0); print }
          ' .github/workflows/ci.yml | grep -vx 'ci' | sort)
          needed=$(echo "$RESULTS" | jq -r 'keys[]' | sort)
          echo "jobs in ci.yml: $(echo "$declared" | tr '\n' ' ')"
          echo "gate needs:     $(echo "$needed" | tr '\n' ' ')"
          if [ "$declared" != "$needed" ]; then
            echo "FAIL: ci.yml and this gate's needs list disagree, so a job is"
            echo "      running outside the one required status check and can"
            echo "      fail without blocking a merge."
            diff <(echo "$needed") <(echo "$declared") || true
            echo "      Add it to the 'needs:' of the 'ci' job."
            exit 1
          fi
          echo "OK: the gate covers every job."

      # Success is the only result that passes, `skipped` included.
      #
      # No job here carries a job-level `if:`, so the only way one reports
      # `skipped` is that something it needs failed or was cancelled - which is
      # a red run being laundered into a green gate if it is let through. The
      # deliberate skips this workflow does have, the GOWORK=off gates in
      # `build` and the empty-profile gates in `coverage`, are `exit 0` inside a
      # step: the step passes and so does its job, and none of them can reach
      # this expression.
      - name: Every needed job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"' | sort
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "  \(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "FAIL: these jobs did not succeed:"
            echo "$bad"
            exit 1
          fi
          echo "OK: every job succeeded."
