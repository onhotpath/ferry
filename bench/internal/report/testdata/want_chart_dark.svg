<text x="16.0" y="60.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#9198a1" text-anchor="start">a workstation, not a runner, Go go1.27rc2, -count 10, -benchtime 1s. Whiskers are benchstat's 95% confidence interval.</text>
<text x="16.0" y="75.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#9198a1" text-anchor="start">Rows are ordered by warm time, fastest first, in every scenario. A library with no mark was not measured and says so.</text>
